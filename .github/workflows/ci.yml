name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/deploy/src/course-release.test.ts packages/deploy/src/secret-presets.test.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MASTRA_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle-secrets
      - run: npm run check:env-example
      - run: npx openspec validate --all --strict

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # L72 definition of done: the image builds, the container starts and becomes ready, a missing secret fails
  # clearly, and readiness reflects a broken dependency (read-only data volume).
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -t mastra-learning-platform:ci .
      - run: npm run smoke:container -- mastra-learning-platform:ci

  # L74 release gates: security, load-smoke, eval-regression, tracing, workflow-recovery and accessibility.
  # Fails on any gate (thresholds in regression/gates.json) and uploads the evidence for every run.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: |
            regression/evidence/
            regression/REPORT.md
          retention-days: 30
